<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Reader — Biblia Sacra Cebu</title>
<script>
(function () {
  try {
    var saved = window.localStorage.getItem("bibliaSacraReaderTheme");
    if (saved === "dark") {
      document.documentElement.setAttribute("data-reader-theme", "dark");
    }
  } catch (e) { /* storage unavailable */ }
})();
</script>
<meta name="description" content="Read the Holy Scripture verse by verse, at your own pace.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/bible.css">
</head>
<body class="reader-body">

<a class="skip-link" href="#readerMain">Skip to Scripture</a>

<div class="reader-topbars" id="readerTopbars">
  <header class="reader-header">
    <div class="reader-header-inner">
      <div class="reader-header-left">
        <a class="back-link" href="index.html">
          <span class="back-arrow" aria-hidden="true">&lt;</span>
          <span class="back-label">Back</span>
        </a>

        <div class="reader-brand">
          <span class="reader-brand-badge" aria-hidden="true">&#10013;</span>
          <span class="reader-brand-text">
            <span class="reader-brand-name">Biblia Sacra</span>
            <span class="reader-brand-tag">Holy Scripture</span>
          </span>
        </div>
      </div>

      <nav class="reader-select-group" aria-label="Book and chapter">
        <select class="control-select" id="testamentSelect" aria-label="Testament">
          <option value="ot">Old Testament</option>
          <option value="nt">New Testament</option>
        </select>

        <select class="control-select" id="bookSelect" aria-label="Book"></select>

        <select class="control-select" id="chapterSelect" aria-label="Chapter"></select>
      </nav>

      <div class="reader-header-actions">
        <button class="search-toggle" id="searchToggle" type="button" aria-haspopup="dialog" aria-controls="searchOverlay">
          <span aria-hidden="true">&#128269;</span>
          <span class="search-label">Search</span>
        </button>

        <button class="menu-toggle" id="menuToggleBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="readerToolbarBar">
          <span aria-hidden="true">&#9776;</span>
          <span class="menu-label">Menu</span>
        </button>
      </div>
    </div>
  </header>

  <div class="reader-toolbar-bar" id="readerToolbarBar" hidden>
    <div class="reader-toolbar-inner" role="group" aria-label="Reading tools">

      <div class="theme-segmented" role="group" aria-label="Reading theme">
        <button class="theme-segmented-btn" id="themeLightBtn" type="button" aria-pressed="true">
          <span aria-hidden="true">&#9728;</span><span class="segmented-label">Light</span>
        </button>
        <button class="theme-segmented-btn" id="themeDarkBtn" type="button" aria-pressed="false">
          <span aria-hidden="true">&#9790;</span><span class="segmented-label">Dark</span>
        </button>
      </div>

      <div class="font-size-control" role="group" aria-label="Adjust text size">
        <button class="font-size-btn" id="fontDecreaseBtn" type="button" aria-label="Decrease text size">A&#8722;</button>
        <input class="font-size-slider" id="fontSizeSlider" type="range" min="0" max="8" step="1" value="1"
               aria-label="Text size" aria-valuetext="100%">
        <button class="font-size-btn" id="fontIncreaseBtn" type="button" aria-label="Increase text size">A&#43;</button>
        <span class="font-size-label" id="fontSizeLabel">100%</span>
        <button class="font-size-reset-btn" id="fontResetBtn" type="button">Reset</button>
      </div>

      <div class="toolbar-more" id="toolbarMore">
        <button class="toolbar-icon-btn" id="toolbarMoreBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="More reading options">
          <span aria-hidden="true">&#8943;</span>
        </button>
        <div class="toolbar-more-menu" id="toolbarMoreMenu" role="menu" hidden>
          <button class="toolbar-more-item" id="notesMenuItem" type="button" role="menuitem">
            <span aria-hidden="true">&#128214;</span><span class="more-item-label">Notes</span>
          </button>
          <button class="toolbar-more-item" id="printChapterBtn" type="button" role="menuitem">
            <span aria-hidden="true">&#128424;</span><span class="more-item-label">Print</span>
          </button>
          <button class="toolbar-more-item" id="copyChapterBtn" type="button" role="menuitem">
            <span aria-hidden="true">&#128203;</span><span class="more-item-label">Copy Chapter</span>
          </button>
          <button class="toolbar-more-item" id="shareMenuItem" type="button" role="menuitem">
            <span aria-hidden="true">&#128279;</span><span class="more-item-label">Share this chapter</span>
          </button>
          <button class="toolbar-more-item" id="copyChapterLinkBtn" type="button" role="menuitem">
            <span aria-hidden="true">&#128279;</span><span class="more-item-label">Copy chapter link</span>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

<main id="readerMain" class="reader-main">
  <div class="reading-card" id="readingCard">
    <div class="reader-status">
      <div class="status-cross" aria-hidden="true">&#10013;</div>
      <p class="status-text">Opening the Word&hellip;</p>
    </div>
  </div>

  <div class="chapter-nav" id="chapterNav" hidden>
    <div class="chapter-nav-inner">
      <button class="chapter-nav-btn prev" id="prevChapterBtn" type="button">
        <span class="nav-btn-icon" aria-hidden="true">&#8592;</span>
        <span class="nav-btn-text">
          <span class="nav-label-full">Previous Chapter</span>
          <span class="nav-label-ref" id="prevChapterLabel"></span>
        </span>
      </button>

      <button class="chapter-nav-btn list" id="viewChapterListBtn" type="button" aria-haspopup="dialog" aria-controls="chapterListModal">
        <span class="nav-btn-icon" aria-hidden="true">&#128214;</span>
        <span class="nav-label-full">View Chapter List</span>
      </button>

      <button class="chapter-nav-btn next" id="nextChapterBtn" type="button">
        <span class="nav-btn-text">
          <span class="nav-label-full">Next Chapter</span>
          <span class="nav-label-ref" id="nextChapterLabel"></span>
        </span>
        <span class="nav-btn-icon" aria-hidden="true">&#8594;</span>
      </button>
    </div>
  </div>
</main>

<div class="chapter-list-overlay" id="chapterListModal" role="dialog" aria-modal="true" aria-label="Jump to chapter">
  <div class="chapter-list-panel">
    <div class="chapter-list-header">
      <span class="chapter-list-title" id="chapterListTitle">Chapters</span>
      <button class="search-close" id="chapterListClose" type="button" aria-label="Close chapter list">&times;</button>
    </div>
    <div class="chapter-list-grid" id="chapterListGrid"></div>
  </div>
</div>

<div class="search-overlay" id="searchOverlay" role="dialog" aria-modal="true" aria-label="Search the Bible">
  <div class="search-panel">
    <div class="search-panel-header">
      <span class="search-icon" aria-hidden="true">&#128269;</span>
      <input type="text" id="searchInput" placeholder="Search Scripture&hellip;" autocomplete="off" aria-label="Search Scripture">
      <button class="search-close" id="searchClose" type="button" aria-label="Close search">&times;</button>
    </div>
    <div class="search-results" id="searchResults">
      <p class="search-hint">Type at least 3 letters to search the whole Bible.</p>
    </div>
  </div>
</div>

<script src="js/bible-books.js" defer></script>
<script src="js/bible.js" defer></script>
</body>
</html>
