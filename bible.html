<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Reader — Biblia Sacra Cebu</title>
<meta name="description" content="Read the Holy Scripture verse by verse, at your own pace.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/bible.css">
</head>
<body class="reader-body">

<a class="skip-link" href="#readerMain">Skip to Scripture</a>

<header class="reader-header">
  <div class="reader-header-inner">
    <a class="back-link" href="index.html">
      <span class="back-arrow" aria-hidden="true">&#8592;</span>
      <span class="back-label">Back to Homepage</span>
    </a>

    <div class="reader-brand">
      <span class="reader-brand-name">Biblia Sacra</span>
      <span class="reader-brand-tag">Holy Scripture</span>
    </div>

    <button class="search-toggle" id="searchToggle" type="button" aria-haspopup="dialog" aria-controls="searchOverlay">
      <span aria-hidden="true">&#128269;</span>
      <span class="search-label">Search</span>
    </button>
  </div>
</header>

<nav class="reader-controls" aria-label="Book and chapter">
  <select class="control-select" id="testamentSelect" aria-label="Testament">
    <option value="ot">Old Testament</option>
    <option value="nt">New Testament</option>
  </select>

  <select class="control-select" id="bookSelect" aria-label="Book"></select>

  <select class="control-select" id="chapterSelect" aria-label="Chapter"></select>
</nav>

<main id="readerMain" class="reader-main">
  <div class="reading-card" id="readingCard">
    <div class="reader-status">
      <div class="status-cross" aria-hidden="true">&#10013;</div>
      <p class="status-text">Opening the Word&hellip;</p>
    </div>
  </div>

  <div class="chapter-nav" id="chapterNav" hidden>
    <button class="chapter-nav-btn prev" id="prevChapterBtn" type="button">
      <span aria-hidden="true">&#8592;</span>
      <span class="nav-label-full">Previous Chapter</span>
    </button>
    <span class="chapter-nav-current" id="chapterNavCurrent"></span>
    <button class="chapter-nav-btn next" id="nextChapterBtn" type="button">
      <span class="nav-label-full">Next Chapter</span>
      <span aria-hidden="true">&#8594;</span>
    </button>
  </div>
</main>

<div class="search-overlay" id="searchOverlay" role="dialog" aria-modal="true" aria-label="Search the Bible">
  <div class="search-panel">
    <div class="search-panel-header">
      <span class="search-icon" aria-hidden="true">&#128269;</span>
      <input type="text" id="searchInput" placeholder="Search Scripture&hellip;" autocomplete="off" aria-label="Search Scripture">
      <button class="search-close" id="searchClose" type="button" aria-label="Close search">&times;</button>
    </div>
    <div class="search-results" id="searchResults">
      <p class="search-hint">Type at least 3 letters to search the whole Bible.</p>
    </div>
  </div>
</div>

<script src="js/bible-books.js" defer></script>
<script src="js/bible.js" defer></script>
</body>
</html>
