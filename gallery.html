<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Biblia Sacra Cebu</title>
<meta name="description" content="Moments of light — a gallery of images from the Biblia Sacra community.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/gallery.css">
</head>
<body class="reader-body gallery-body">

<a class="skip-link" href="#galleryMain">Skip to Gallery</a>

<header class="reader-header">
  <div class="reader-header-inner">
    <a class="back-link" href="index.html">
      <span class="back-arrow" aria-hidden="true">&#8592;</span>
      <span class="back-label">Back to Homepage</span>
    </a>

    <div class="reader-brand">
      <span class="reader-brand-name">Biblia Sacra</span>
      <span class="reader-brand-tag">Gallery</span>
    </div>

    <span class="header-spacer" aria-hidden="true"></span>
  </div>
</header>

<section class="gallery-hero">
  <div id="vantaBg" class="gallery-hero-bg"></div>
  <div class="gallery-hero-content">
    <span class="gallery-hero-icon" aria-hidden="true">
      <img src="assets/icons/gallery.png" alt="">
    </span>
    <h1>Gallery</h1>
    <p>Moments of Light</p>
  </div>
</section>

<main id="galleryMain" class="gallery-main">
  <div class="gallery-intro">
    <p>A quiet collection of images from our community &mdash; worship, fellowship, and the everyday grace of walking in faith together.</p>
  </div>

  <div class="gallery-filter" role="group" aria-label="Filter gallery">
    <button class="gallery-filter-btn is-active" data-filter="all" type="button">All</button>
    <button class="gallery-filter-btn" data-filter="worship" type="button">Worship</button>
    <button class="gallery-filter-btn" data-filter="community" type="button">Community</button>
    <button class="gallery-filter-btn" data-filter="scripture" type="button">Scripture</button>
    <button class="gallery-filter-btn" data-filter="nature" type="button">Nature</button>
  </div>

  <div class="gallery-grid" id="galleryGrid"></div>
</main>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" type="button" aria-label="Previous image">&#8249;</button>
  <figure class="lightbox-figure">
    <img id="lightboxImg" src="" alt="">
    <figcaption id="lightboxCaption"></figcaption>
  </figure>
  <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="Next image">&#8250;</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>
<script src="js/gallery-data.js"></script>
<script src="js/gallery.js" defer></script>
</body>
</html>
